name: "Release Proxy Library"

on:
  push:
    tags:
      - '*'

  workflow_dispatch:
    inputs:
      version:
        description: "Plugin version"
        required: true
        type: string

      create_release:
        description: "Create release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  plugin:
    runs-on: windows-latest

    steps:
      - name: Determine version
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } else {
            $version = "${{ github.ref_name }}"
          }

          echo "PROJECT_VERSION=$version" >> $env:GITHUB_ENV
          echo "Version: $version"

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          lfs: true

      - name: Set up MSVC
        uses: ./.github/actions/msvc-dev-cmd
        with:
          arch: x86

      - name: Compile library
        run: |
          cmake . --preset msvc-x86-release
          cmake --build --preset msvc-x86-release

      - name: Upload library as artifact
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.create_release }}
        uses: actions/upload-artifact@v7
        with:
          name: library-${{ env.PROJECT_VERSION }}
          path: "/out/build/msvc-x86-release/imagehl2.dll"

      - name: Release library
        if: ${{ github.event_name == 'push' || inputs.create_release }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.PROJECT_VERSION }}
          body_path: CHANGELOG.md
          files: "/out/build/msvc-x86-release/imagehl2.dll"
